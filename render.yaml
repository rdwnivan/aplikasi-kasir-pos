# Render Blueprint for the public demo: one free Docker web service in Singapore.
# The database is an external PostgreSQL (Neon free tier); Render's own free Postgres is
# deleted after 30 days. Values marked `sync: false` are asked for when the Blueprint is
# applied and never live in this file. See README → Deploy (Render + Neon).
services:
    - type: web
      name: aplikasi-kasir-pos
      runtime: docker
      plan: free
      region: singapore
      dockerfilePath: ./Dockerfile
      healthCheckPath: /up
      autoDeployTrigger: commit
      envVars:
          # base64:… from `php artisan key:generate --show`
          - key: APP_KEY
            sync: false
          # Neon connection string (direct, not pooled), e.g.
          # postgresql://user:password@ep-….ap-southeast-1.aws.neon.tech/neondb?sslmode=require
          - key: DB_URL
            sync: false
          # Midtrans sandbox server key (optional; QRIS is unavailable without it)
          - key: MIDTRANS_SERVER_KEY
            sync: false
          - key: MIDTRANS_IS_PRODUCTION
            value: 'false'
          - key: APP_NAME
            value: Kasir POS
          - key: APP_LOCALE
            value: id
          - key: APP_TIMEZONE
            value: Asia/Jakarta
          - key: DB_CONNECTION
            value: pgsql
          - key: SESSION_DRIVER
            value: database
          - key: SESSION_SECURE_COOKIE
            value: 'true'
          - key: CACHE_STORE
            value: database
          # Nothing is queued today; run jobs inline rather than leave them in a table with no worker.
          - key: QUEUE_CONNECTION
            value: sync
          - key: MAIL_MAILER
            value: log
          - key: TRUSTED_PROXIES
            value: '*'
          # Demo data: roles, demo accounts, catalogue and 30 days of sales history.
          - key: DEMO_SEED
            value: 'true'
          - key: POS_DEMO_SALES_HISTORY
            value: 'true'

name: deploy-space

# Mirrors main to the Hugging Face Space that hosts the public demo; the Space builds the
# Dockerfile itself. Needs the HF_TOKEN secret (write token) and the HF_SPACE variable
# ("user/space-name"). Without them the job is skipped.

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    name: Push to Hugging Face Space
    runs-on: ubuntu-latest
    # Only after a green test run on a push to main (or by hand), and only once configured.
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # The Space is a snapshot, not a copy of the history: Hugging Face rejects plain-git
      # binaries, so images go through LFS, and the README screenshots stay on GitHub.
      - name: Build Space snapshot
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          rm -rf .git docs
          {
            echo '---'
            echo 'title: Kasir POS'
            echo 'emoji: 🧾'
            echo 'colorFrom: yellow'
            echo 'colorTo: gray'
            echo 'sdk: docker'
            echo 'app_port: 8080'
            echo 'pinned: false'
            echo '---'
            echo
            echo '# Kasir POS + Stock Management'
            echo
            echo "Demo of [${REPO_URL#https://github.com/}](${REPO_URL}) (commit \`${SHA:0:7}\`)."
            echo 'Point-of-sale and stock management for an Indonesian retail store: Laravel, Inertia, React, PostgreSQL.'
            echo
            echo 'Demo accounts (password `password`): `owner@kasir.test`, `gudang@kasir.test`, `kasir@kasir.test`.'
          } > README.md
          git init -q -b main
          git lfs install --local
          git lfs track '*.png' '*.jpg' '*.jpeg' '*.gif' '*.ico' '*.webp' '*.woff' '*.woff2'
          git add -A
          git -c user.name='github-actions' -c user.email='github-actions@users.noreply.github.com' \
            commit -q -m "Deploy ${SHA:0:7}"

      # Force: the Space only ever holds the latest snapshot of main.
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
